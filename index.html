<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Game Motor 3D Mobile & PC</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #120524;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        #canvas-container {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* LAYAR MENU UTAMA */
        #main-menu {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #120524 0%, #3a1c5d 50%, #d35400 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 50;
            color: white;
            text-align: center;
            padding: 20px;
        }

        #main-menu h1 {
            font-size: 48px;
            margin: 0;
            color: #f1c40f;
            text-shadow: 0 4px 15px rgba(0,0,0,0.6);
            letter-spacing: 2px;
        }

        #main-menu p {
            font-size: 16px;
            color: #e0e0e0;
            margin-top: 10px;
            margin-bottom: 30px;
            max-width: 500px;
            line-height: 1.5;
        }

        .btn-start {
            padding: 16px 45px;
            font-size: 24px;
            font-weight: 900;
            background: linear-gradient(45deg, #2ecc71, #27ae60);
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(46, 204, 113, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
            touch-action: manipulation;
        }

        .btn-start:active {
            transform: scale(0.95);
            box-shadow: 0 4px 10px rgba(46, 204, 113, 0.6);
        }

        /* UI IN-GAME */
        #ui {
            position: absolute;
            top: 15px;
            left: 15px;
            color: white;
            pointer-events: none;
            z-index: 5;
            display: none;
            flex-direction: column;
            gap: 6px;
        }

        .score-box {
            font-size: 22px;
            font-weight: bold;
            text-shadow: 2px 2px 5px rgba(0,0,0,0.8);
        }

        .speed-box {
            font-size: 26px;
            font-weight: 900;
            color: #2ecc71;
            text-shadow: 2px 2px 6px rgba(0,0,0,0.9);
        }

        #stunt-status {
            font-size: 20px;
            color: #ffee58;
            font-weight: bold;
            text-shadow: 2px 2px 5px rgba(0,0,0,0.9);
            display: none;
        }

        #btn-pause-ui {
            position: absolute;
            top: 15px;
            right: 15px;
            width: 48px;
            height: 48px;
            background: rgba(255, 255, 255, 0.25);
            border: 2px solid rgba(255, 255, 255, 0.7);
            border-radius: 50%;
            color: white;
            font-size: 20px;
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 10;
            cursor: pointer;
        }

        #btn-pov-single {
            position: absolute;
            top: 75px;
            right: 15px;
            padding: 10px 16px;
            background: rgba(0, 0, 0, 0.65);
            border: 2px solid #f39c12;
            border-radius: 20px;
            color: #f1c40f;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            backdrop-filter: blur(5px);
            touch-action: manipulation;
            z-index: 10;
            display: none;
            box-shadow: 0 4px 8px rgba(0,0,0,0.4);
        }

        .overlay-screen {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.88);
            color: white;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
        }

        .overlay-screen h1 {
            font-size: 42px;
            margin-bottom: 10px;
            color: #ff4757;
        }

        .final-stats {
            font-size: 20px;
            margin: 5px 0;
            color: #ddd;
        }

        .action-btn {
            margin-top: 25px;
            padding: 15px 35px;
            font-size: 20px;
            background-color: #ea2027;
            color: white;
            border: none;
            border-radius: 25px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        /* KONTROL MOBILE */
        .controls {
            position: absolute;
            bottom: 20px;
            width: 100%;
            display: none;
            justify-content: space-between;
            padding: 0 15px;
            z-index: 10;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .horizontal-btns {
            display: flex;
            gap: 10px;
        }

        .stunt-btns {
            display: flex;
            gap: 8px;
        }

        .btn {
            width: 65px;
            height: 65px;
            background: rgba(255, 255, 255, 0.25);
            border: 2px solid rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 26px;
            font-weight: bold;
            touch-action: manipulation;
        }

        .btn:active {
            background: rgba(255, 255, 255, 0.6);
        }

        .btn-stunt {
            width: 58px;
            height: 58px;
            background: rgba(255, 238, 88, 0.3);
            border-color: #ffee58;
            color: #ffee58;
            font-size: 11px;
            border-radius: 18px;
            text-align: center;
            line-height: 1.2;
        }

        #btn-gas {
            background: rgba(46, 213, 115, 0.4);
            border-color: #2ed573;
            width: 70px;
            height: 70px;
        }

        #btn-brake {
            background: rgba(255, 71, 87, 0.4);
            border-color: #ff4757;
            width: 65px;
            height: 65px;
            font-size: 14px;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="main-menu">
        <h1>MOTOR 3D RIDER</h1>
        <p>Gunakan Layar Sentuh Mobile atau Keyboard Laptop (W/A/S/D / Tombol Panah & 1/2/3 untuk Gaya)!</p>
        <button class="btn-start" onclick="startGame()">MULAI GAME</button>
    </div>

    <div id="ui">
        <div class="score-box">Skor: <span id="score">0</span></div>
        <div class="speed-box"><span id="speed">0</span> <small style="font-size: 16px;">km/h</small></div>
        <div id="stunt-status">🔥 WHEELIE!</div>
    </div>

    <div id="btn-pause-ui" onclick="togglePause()">⏸️</div>
    <div id="btn-pov-single" onclick="cyclePOV()">📷 POV: BELAKANG</div>

    <div id="pause-screen" class="overlay-screen">
        <h1 style="color: #f1c40f;">GAME PAUSED</h1>
        <button class="action-btn" style="background-color: #2ecc71;" onclick="togglePause()">Lanjutkan</button>
    </div>

    <div id="game-over" class="overlay-screen">
        <h1>GAME OVER</h1>
        <div class="final-stats">Total Skor: <span id="final-score">0</span></div>
        <div class="final-stats">Poin Gaya: <span id="final-stunt-score">0</span></div>
        <button class="action-btn" onclick="resetGame()">Main Lagi</button>
    </div>

    <div id="canvas-container"></div>

    <div class="controls" id="game-controls">
        <div class="btn-group">
            <div class="horizontal-btns">
                <div class="btn" id="btn-left">◀</div>
                <div class="btn" id="btn-right">▶</div>
            </div>
        </div>
        <div class="btn-group" style="align-items: flex-end;">
            <div class="stunt-btns">
                <div class="btn btn-stunt" id="btn-stunt1">WHEELIE</div>
                <div class="btn btn-stunt" id="btn-stunt2">STOPPIE</div>
                <div class="btn btn-stunt" id="btn-stunt3">SUPER MAN</div>
            </div>
            <div class="horizontal-btns">
                <div class="btn" id="btn-brake">🛑 REM</div>
                <div class="btn" id="btn-gas">▲</div>
            </div>
        </div>
    </div>

    <script>
        let scene, camera, renderer;
        let player, frontWheelMesh, backWheelMesh, riderGroup;
        let brakeLightMesh, brakeLightPoint;
        let exhaustFlameGroup, flameLight, sparkParticles;
        
        const SEGMENT_SIZE = 300;
        const NUM_SEGMENTS = 5;
        let roadSegments = [];
        let groundSegments = [];
        
        let streetLights = [];
        let trees = [];
        let clouds = [];
        let sunGroup;
        let obstacles = [];
        let lastObstacleZ = 0;
        
        let gameStarted = false;
        let isGameOver = false;
        let isPaused = false;

        let moveLeft = false;
        let moveRight = false;
        let isAccelerating = false;
        let isBraking = false;
        let currentStuntMode = 0;

        const povList = [
            { id: 'BACK', label: '📷 POV: BELAKANG' },
            { id: 'DRIVER', label: '🏍️ POV: PENGEMUDI' },
            { id: 'LEFT', label: '⬅️ POV: KIRI' },
            { id: 'RIGHT', label: '➡️ POV: KANAN' },
            { id: 'FRONT', label: '📸 POV: DEPAN' }
        ];
        let currentPovIndex = 0;

        let currentSpeedKmh = 0;
        const baseMinSpeedKmh = 35;
        let distanceScore = 0;
        let stuntScore = 0;
        let totalScore = 0;
        const roadWidth = 10;
        
        let currentRotZ = 0;
        let currentRotX = 0;

        let audioCtx, oscMain, oscSub, mainGain, masterGain, engineFilter;
        let soundReady = false;

        function initAudio() {
            if (soundReady) {
                if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
                return;
            }
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();

                masterGain = audioCtx.createGain();
                masterGain.gain.setValueAtTime(0.15, audioCtx.currentTime);

                engineFilter = audioCtx.createBiquadFilter();
                engineFilter.type = 'lowpass';
                engineFilter.frequency.setValueAtTime(400, audioCtx.currentTime);

                oscMain = audioCtx.createOscillator();
                oscMain.type = 'sawtooth';
                oscMain.frequency.setValueAtTime(45, audioCtx.currentTime);

                oscSub = audioCtx.createOscillator();
                oscSub.type = 'triangle';
                oscSub.frequency.setValueAtTime(22.5, audioCtx.currentTime);

                mainGain = audioCtx.createGain();
                mainGain.gain.setValueAtTime(0.3, audioCtx.currentTime);

                oscMain.connect(engineFilter);
                oscSub.connect(engineFilter);
                engineFilter.connect(mainGain);
                mainGain.connect(masterGain);
                masterGain.connect(audioCtx.destination);

                oscMain.start();
                oscSub.start();
                soundReady = true;
            } catch (e) {}
        }

        function updateSound() {
            if (!soundReady || !audioCtx || !gameStarted || isGameOver || isPaused) return;
            try {
                if (audioCtx.state === 'suspended') audioCtx.resume();

                let targetFreq = 40 + (currentSpeedKmh * 0.95);
                if (currentStuntMode > 0) targetFreq += 25;

                oscMain.frequency.setTargetAtTime(targetFreq, audioCtx.currentTime, 0.08);
                oscSub.frequency.setTargetAtTime(targetFreq * 0.5, audioCtx.currentTime, 0.08);

                let filterCutoff = 300 + (currentSpeedKmh * 8);
                engineFilter.frequency.setTargetAtTime(filterCutoff, audioCtx.currentTime, 0.1);

                let volume = isAccelerating ? 0.22 : (isBraking ? 0.04 : 0.08);
                masterGain.gain.setTargetAtTime(volume, audioCtx.currentTime, 0.1);
            } catch (e) {}
        }

        function playCrashSound() {
            if (!audioCtx) return;
            try {
                if (masterGain) masterGain.gain.setTargetAtTime(0, audioCtx.currentTime, 0.05);

                const bufferSize = audioCtx.sampleRate * 0.4;
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = Math.random() * 2 - 1;
                }

                const noise = audioCtx.createBufferSource();
                noise.buffer = buffer;

                const noiseFilter = audioCtx.createBiquadFilter();
                noiseFilter.type = 'lowpass';
                noiseFilter.frequency.setValueAtTime(800, audioCtx.currentTime);

                const noiseGain = audioCtx.createGain();
                noiseGain.gain.setValueAtTime(0.5, audioCtx.currentTime);
                noiseGain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.38);

                noise.connect(noiseFilter);
                noiseFilter.connect(noiseGain);
                noiseGain.connect(audioCtx.destination);

                noise.start();
                noise.stop(audioCtx.currentTime + 0.4);
            } catch (e) {}
        }

        function cyclePOV() {
            currentPovIndex = (currentPovIndex + 1) % povList.length;
            const currentPov = povList[currentPovIndex];
            document.getElementById('btn-pov-single').innerText = currentPov.label;
            updateCameraPosition();
        }

        function startGame() {
            initAudio();
            gameStarted = true;
            document.getElementById('main-menu').style.display = 'none';
            document.getElementById('ui').style.display = 'flex';
            document.getElementById('btn-pause-ui').style.display = 'flex';
            document.getElementById('btn-pov-single').style.display = 'block';
            document.getElementById('game-controls').style.display = 'flex';
            
            resetGame();
        }

        function init() {
            const container = document.getElementById('canvas-container');

            scene = new THREE.Scene();
            scene.background = createSunsetGradient();
            scene.fog = new THREE.FogExp2(0x5e2a84, 0.0020);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 2000);
            
            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            container.appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xffaa77, 0.9);
            scene.add(ambientLight);

            const sunLight = new THREE.DirectionalLight(0xff7733, 1.4);
            sunLight.position.set(0, 40, -200);
            sunLight.castShadow = true;
            scene.add(sunLight);

            createRealisticSun();
            createEndlessRoadAndGround();
            createStreetLights();
            createTrees();
            createClouds();
            createMotorcycleWithRider();

            setupControls();
            window.addEventListener('resize', onWindowResize);

            updateCameraPosition();
            animate();
        }

        function createSunsetGradient() {
            const canvas = document.createElement('canvas');
            canvas.width = 32;
            canvas.height = 64;
            const ctx = canvas.getContext('2d');
            const gradient = ctx.createLinearGradient(0, 0, 0, 64);
            gradient.addColorStop(0, '#120524');
            gradient.addColorStop(0.4, '#5e2a84');
            gradient.addColorStop(0.7, '#d35400');
            gradient.addColorStop(1, '#f39c12');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, 32, 64);

            return new THREE.CanvasTexture(canvas);
        }

        function createRealisticSun() {
            sunGroup = new THREE.Group();

            const coreGeo = new THREE.SphereGeometry(14, 32, 32);
            const coreMat = new THREE.MeshBasicMaterial({ color: 0xfff3a0 });
            const core = new THREE.Mesh(coreGeo, coreMat);
            sunGroup.add(core);

            const innerGlowGeo = new THREE.SphereGeometry(22, 32, 32);
            const innerGlowMat = new THREE.MeshBasicMaterial({ color: 0xffaa00, transparent: true, opacity: 0.4 });
            const innerGlow = new THREE.Mesh(innerGlowGeo, innerGlowMat);
            sunGroup.add(innerGlow);

            const outerGlowGeo = new THREE.SphereGeometry(32, 32, 32);
            const outerGlowMat = new THREE.MeshBasicMaterial({ color: 0xe67e22, transparent: true, opacity: 0.2 });
            const outerGlow = new THREE.Mesh(outerGlowGeo, outerGlowMat);
            sunGroup.add(outerGlow);

            sunGroup.position.set(0, 25, -450);
            scene.add(sunGroup);
        }

        function createEndlessRoadAndGround() {
            const groundGeo = new THREE.PlaneGeometry(800, SEGMENT_SIZE);
            const groundMat = new THREE.MeshStandardMaterial({ color: 0x1a252f, roughness: 0.9 });

            const roadGeo = new THREE.PlaneGeometry(roadWidth, SEGMENT_SIZE);
            const roadMat = new THREE.MeshStandardMaterial({ color: 0x1e272e, roughness: 0.8 });

            const lineGeo = new THREE.PlaneGeometry(0.35, SEGMENT_SIZE);
            const lineMat = new THREE.MeshBasicMaterial({ color: 0xf1c40f });

            const curbGeo = new THREE.BoxGeometry(0.8, 0.2, SEGMENT_SIZE);
            const curbMat = new THREE.MeshStandardMaterial({ color: 0x7f8c8d });

            for (let i = 0; i < NUM_SEGMENTS; i++) {
                const zPos = -i * SEGMENT_SIZE;

                const gMesh = new THREE.Mesh(groundGeo, groundMat);
                gMesh.rotation.x = -Math.PI / 2;
                gMesh.position.set(0, -0.02, zPos);
                gMesh.receiveShadow = true;
                scene.add(gMesh);
                groundSegments.push(gMesh);

                const rGroup = new THREE.Group();
                const rMesh = new THREE.Mesh(roadGeo, roadMat);
                rMesh.rotation.x = -Math.PI / 2;
                rMesh.receiveShadow = true;
                rGroup.add(rMesh);

                const line = new THREE.Mesh(lineGeo, lineMat);
                line.rotation.x = -Math.PI / 2;
                line.position.y = 0.01;
                rGroup.add(line);

                const leftCurb = new THREE.Mesh(curbGeo, curbMat);
                leftCurb.position.set(-roadWidth / 2 - 0.4, 0.1, 0);
                rGroup.add(leftCurb);

                const rightCurb = leftCurb.clone();
                rightCurb.position.x = roadWidth / 2 + 0.4;
                rGroup.add(rightCurb);

                rGroup.position.set(0, 0, zPos);
                scene.add(rGroup);
                roadSegments.push(rGroup);
            }
        }

        function createStreetLights() {
            const poleMat = new THREE.MeshStandardMaterial({ color: 0x2c3e50, metalness: 0.8 });
            const bulbMat = new THREE.MeshStandardMaterial({ color: 0xfff0a5, emissive: 0xfff0a5, emissiveIntensity: 2.0 });

            for (let z = 100; z > -900; z -= 35) {
                [-1, 1].forEach(side => {
                    const lampGroup = new THREE.Group();

                    const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.14, 6, 8), poleMat);
                    pole.position.y = 3;
                    lampGroup.add(pole);

                    const arm = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.08, 0.08), poleMat);
                    arm.position.set(-side * 0.5, 5.8, 0);
                    lampGroup.add(arm);

                    const bulb = new THREE.Mesh(new THREE.SphereGeometry(0.28, 12, 12), bulbMat);
                    bulb.position.set(-side * 1.0, 5.7, 0);
                    lampGroup.add(bulb);

                    lampGroup.position.set(side * (roadWidth / 2 + 1.2), 0, z);
                    scene.add(lampGroup);
                    streetLights.push(lampGroup);
                });
            }
        }

        function createTrees() {
            const trunkMat = new THREE.MeshStandardMaterial({ color: 0x3d2314, roughness: 0.9 });
            const leavesMat1 = new THREE.MeshStandardMaterial({ color: 0x1b4332, roughness: 0.8 });
            const leavesMat2 = new THREE.MeshStandardMaterial({ color: 0x2d6a4f, roughness: 0.8 });

            const trunkGeo = new THREE.CylinderGeometry(0.2, 0.4, 2.8, 8);
            const foliageGeo1 = new THREE.ConeGeometry(1.8, 3.2, 8);
            const foliageGeo2 = new THREE.ConeGeometry(1.3, 2.5, 8);

            for (let i = 0; i < 70; i++) {
                const tree = new THREE.Group();
                const trunk = new THREE.Mesh(trunkGeo, trunkMat);
                trunk.position.y = 1.4;
                tree.add(trunk);

                const foliage1 = new THREE.Mesh(foliageGeo1, leavesMat1);
                foliage1.position.y = 3.2;
                tree.add(foliage1);

                const foliage2 = new THREE.Mesh(foliageGeo2, leavesMat2);
                foliage2.position.y = 4.3;
                tree.add(foliage2);

                const side = Math.random() < 0.5 ? -1 : 1;
                const xPos = side * (roadWidth / 2 + 2.5 + Math.random() * 22);
                const zPos = 100 - Math.random() * 900;

                tree.position.set(xPos, 0, zPos);
                scene.add(tree);
                trees.push(tree);
            }
        }

        function createClouds() {
            const cloudMat = new THREE.MeshBasicMaterial({ color: 0xd8a1c4, transparent: true, opacity: 0.4 });
            const sphereGeo = new THREE.SphereGeometry(6, 8, 8);

            for (let i = 0; i < 25; i++) {
                const cloud = new THREE.Group();
                const numSpheres = 3 + Math.floor(Math.random() * 3);
                for (let j = 0; j < numSpheres; j++) {
                    const part = new THREE.Mesh(sphereGeo, cloudMat);
                    part.position.set(j * 4.5, Math.random() * 1.5, Math.random() * 2);
                    cloud.add(part);
                }

                const x = (Math.random() - 0.5) * 280;
                const y = 35 + Math.random() * 20;
                const z = 100 - Math.random() * 950;

                cloud.position.set(x, y, z);
                scene.add(cloud);
                clouds.push(cloud);
            }
        }

        function createMotorcycleWithRider() {
            const group = new THREE.Group();

            const bodyMat = new THREE.MeshStandardMaterial({ color: 0xd63031, metalness: 0.8, roughness: 0.2 });
            const wheelMat = new THREE.MeshStandardMaterial({ color: 0x0f0f0f, roughness: 0.9 });
            const chromeMat = new THREE.MeshStandardMaterial({ color: 0xdcdde1, metalness: 0.9, roughness: 0.1 });
            const jacketMat = new THREE.MeshStandardMaterial({ color: 0x222f3e });
            const pantsMat = new THREE.MeshStandardMaterial({ color: 0x101010 });
            const helmetMat = new THREE.MeshStandardMaterial({ color: 0x0984e3 });
            const visorMat = new THREE.MeshStandardMaterial({ color: 0x111111, metalness: 0.95, roughness: 0.05 });

            const wheelGeo = new THREE.CylinderGeometry(0.45, 0.45, 0.22, 20);
            frontWheelMesh = new THREE.Mesh(wheelGeo, wheelMat);
            frontWheelMesh.rotation.z = Math.PI / 2;
            frontWheelMesh.position.set(0, 0.45, -0.95);
            group.add(frontWheelMesh);

            backWheelMesh = frontWheelMesh.clone();
            backWheelMesh.position.set(0, 0.45, 0.95);
            group.add(backWheelMesh);

            const bodyGeo = new THREE.BoxGeometry(0.5, 0.55, 1.3);
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.set(0, 0.8, 0);
            group.add(body);

            const tankGeo = new THREE.BoxGeometry(0.48, 0.35, 0.6);
            const tank = new THREE.Mesh(tankGeo, bodyMat);
            tank.position.set(0, 1.05, -0.2);
            group.add(tank);

            const visorFrontGeo = new THREE.BoxGeometry(0.4, 0.3, 0.3);
            const visorFront = new THREE.Mesh(visorFrontGeo, visorMat);
            visorFront.position.set(0, 1.15, -0.65);
            visorFront.rotation.x = 0.5;
            group.add(visorFront);

            const headlight = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.15, 0.1), new THREE.MeshBasicMaterial({ color: 0xffffcc }));
            headlight.position.set(0, 0.85, -0.66);
            group.add(headlight);

            const brakeMat = new THREE.MeshStandardMaterial({ color: 0x660000, roughness: 0.3 });
            brakeLightMesh = new THREE.Mesh(new THREE.BoxGeometry(0.28, 0.12, 0.08), brakeMat);
            brakeLightMesh.position.set(0, 0.88, 0.66);
            group.add(brakeLightMesh);

            brakeLightPoint = new THREE.PointLight(0xff0000, 0, 4);
            brakeLightPoint.position.set(0, 0.88, 0.75);
            group.add(brakeLightPoint);

            const exhaust = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.1, 0.8, 12), chromeMat);
            exhaust.rotation.x = Math.PI / 2 - 0.2;
            exhaust.position.set(0.3, 0.5, 0.6);
            group.add(exhaust);

            exhaustFlameGroup = new THREE.Group();
            const outerFlame = new THREE.Mesh(
                new THREE.ConeGeometry(0.14, 0.7, 10),
                new THREE.MeshBasicMaterial({ color: 0xff3300, transparent: true, opacity: 0.85 })
            );
            outerFlame.rotation.x = -Math.PI / 2;
            exhaustFlameGroup.add(outerFlame);

            const innerFlame = new THREE.Mesh(
                new THREE.ConeGeometry(0.07, 0.5, 10),
                new THREE.MeshBasicMaterial({ color: 0xffff00, transparent: true, opacity: 0.95 })
            );
            innerFlame.rotation.x = -Math.PI / 2;
            innerFlame.position.z = -0.05;
            exhaustFlameGroup.add(innerFlame);

            flameLight = new THREE.PointLight(0xff5500, 0, 3);
            flameLight.position.set(0, 0, 0.2);
            exhaustFlameGroup.add(flameLight);

            exhaustFlameGroup.position.set(0.3, 0.42, 1.35);
            exhaustFlameGroup.visible = false;
            group.add(exhaustFlameGroup);

            const sparkCount = 18;
            const sparkGeo = new THREE.BufferGeometry();
            const sparkPositions = new Float32Array(sparkCount * 3);
            for (let i = 0; i < sparkCount * 3; i++) {
                sparkPositions[i] = (Math.random() - 0.5) * 0.4;
            }
            sparkGeo.setAttribute('position', new THREE.BufferAttribute(sparkPositions, 3));
            const sparkMat = new THREE.PointsMaterial({ color: 0xffcc00, size: 0.18, transparent: true, opacity: 0.9 });
            sparkParticles = new THREE.Points(sparkGeo, sparkMat);
            sparkParticles.position.set(0, 0.05, 0.95);
            sparkParticles.visible = false;
            group.add(sparkParticles);

            riderGroup = new THREE.Group();
            const torso = new THREE.Mesh(new THREE.CylinderGeometry(0.24, 0.20, 0.65, 10), jacketMat);
            torso.position.set(0, 1.15, 0.1);
            torso.rotation.x = 0.4;
            riderGroup.add(torso);

            const headMesh = new THREE.Mesh(new THREE.SphereGeometry(0.22, 14, 14), helmetMat);
            headMesh.position.set(0, 1.52, -0.05);
            riderGroup.add(headMesh);

            const helmetVisor = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.11, 0.2), visorMat);
            helmetVisor.position.set(0, 1.53, -0.16);
            riderGroup.add(helmetVisor);

            const armGeo = new THREE.CylinderGeometry(0.07, 0.06, 0.55, 8);
            const leftArm = new THREE.Mesh(armGeo, jacketMat);
            leftArm.position.set(-0.26, 1.25, -0.2);
            leftArm.rotation.set(0.8, 0, -0.3);
            riderGroup.add(leftArm);

            const rightArm = leftArm.clone();
            rightArm.position.x = 0.26;
            rightArm.rotation.set(0.8, 0, 0.3);
            riderGroup.add(rightArm);

            const legGeo = new THREE.CylinderGeometry(0.09, 0.08, 0.6, 8);
            const leftLeg = new THREE.Mesh(legGeo, pantsMat);
            leftLeg.position.set(-0.22, 0.8, 0.15);
            leftLeg.rotation.set(-0.5, 0, -0.2);
            riderGroup.add(leftLeg);

            const rightLeg = leftLeg.clone();
            rightLeg.position.x = 0.22;
            rightLeg.rotation.set(-0.5, 0, 0.2);
            riderGroup.add(rightLeg);

            group.add(riderGroup);

            player = group;
            scene.add(player);
        }

        function spawnObstacle() {
            if (!gameStarted || isGameOver || isPaused) return;

            const spawnZ = player.position.z - 120;
            if (lastObstacleZ - spawnZ < 35) return; 

            const wallGroup = new THREE.Group();
            
            const blockGeo = new THREE.BoxGeometry(2.5, 1.2, 0.8);
            const blockMat = new THREE.MeshStandardMaterial({ color: 0x7f8c8d, roughness: 0.8 });
            const block = new THREE.Mesh(blockGeo, blockMat);
            block.position.y = 0.6;
            wallGroup.add(block);

            const stripeGeo = new THREE.BoxGeometry(2.52, 0.3, 0.82);
            const stripeMat = new THREE.MeshStandardMaterial({ color: 0xe67e22 });
            const stripe = new THREE.Mesh(stripeGeo, stripeMat);
            stripe.position.y = 0.7;
            wallGroup.add(stripe);

            const lanes = [-2.8, 0, 2.8];
            const randomLane = lanes[Math.floor(Math.random() * lanes.length)];

            wallGroup.position.set(randomLane, 0, spawnZ);

            scene.add(wallGroup);
            obstacles.push(wallGroup);
            lastObstacleZ = spawnZ;
        }

        function setStuntMode(mode, text) {
            if(!isGameOver && !isPaused && gameStarted) {
                currentStuntMode = mode;
                updateSound();
                const stuntStatus = document.getElementById('stunt-status');
                stuntStatus.innerText = text;
                stuntStatus.style.display = 'block';
            }
        }

        function clearStuntMode() {
            currentStuntMode = 0;
            updateSound();
            document.getElementById('stunt-status').style.display = 'none';
        }

        function setupControls() {
            // Kontrol Touch / Mobile
            const bind = (id, start, end) => {
                const el = document.getElementById(id);
                el.addEventListener('touchstart', (e) => { e.preventDefault(); initAudio(); start(); });
                el.addEventListener('touchend', (e) => { e.preventDefault(); end(); });
                el.addEventListener('mousedown', () => { initAudio(); start(); });
                el.addEventListener('mouseup', end);
            };

            bind('btn-left', () => moveLeft = true, () => moveLeft = false);
            bind('btn-right', () => moveRight = true, () => moveRight = false);
            bind('btn-gas', () => { isAccelerating = true; updateSound(); }, () => { isAccelerating = false; updateSound(); });
            bind('btn-brake', () => { isBraking = true; updateSound(); }, () => { isBraking = false; updateSound(); });

            bind('btn-stunt1', () => setStuntMode(1, '🔥 WHEELIE!'), clearStuntMode);
            bind('btn-stunt2', () => setStuntMode(2, '⚡ STOPPIE!'), clearStuntMode);
            bind('btn-stunt3', () => setStuntMode(3, '🚀 SUPERMAN!'), clearStuntMode);

            // KONTROL KEYBOARD / PC
            window.addEventListener('keydown', (e) => {
                if (!gameStarted) return;
                initAudio();
                const key = e.key.toLowerCase();

                if (key === 'arrowleft' || key === 'a') moveLeft = true;
                if (key === 'arrowright' || key === 'd') moveRight = true;
                if (key === 'arrowup' || key === 'w') { isAccelerating = true; updateSound(); }
                if (key === 'arrowdown' || key === 's') { isBraking = true; updateSound(); }

                if (key === '1') setStuntMode(1, '🔥 WHEELIE!');
                if (key === '2') setStuntMode(2, '⚡ STOPPIE!');
                if (key === '3') setStuntMode(3, '🚀 SUPERMAN!');

                if (key === 'c') cyclePOV();
                if (key === 'p' || key === 'escape') togglePause();
            });

            window.addEventListener('keyup', (e) => {
                if (!gameStarted) return;
                const key = e.key.toLowerCase();

                if (key === 'arrowleft' || key === 'a') moveLeft = false;
                if (key === 'arrowright' || key === 'd') moveRight = false;
                if (key === 'arrowup' || key === 'w') { isAccelerating = false; updateSound(); }
                if (key === 'arrowdown' || key === 's') { isBraking = false; updateSound(); }

                if (key === '1' || key === '2' || key === '3') clearStuntMode();
            });
        }

        function togglePause() {
            if (isGameOver || !gameStarted) return;
            isPaused = !isPaused;
            document.getElementById('pause-screen').style.display = isPaused ? 'flex' : 'none';
            if (isPaused && masterGain) {
                try { masterGain.gain.setValueAtTime(0, audioCtx.currentTime); } catch(e){}
            }
        }

        function updateCameraPosition() {
            if (!player) return;

            const activePov = povList[currentPovIndex].id;

            if (riderGroup) {
                riderGroup.visible = (activePov !== 'DRIVER');
            }

            if (activePov === 'DRIVER') {
                camera.position.set(player.position.x, player.position.y + 1.45, player.position.z - 0.2);
                camera.lookAt(player.position.x, player.position.y + 1.2, player.position.z - 15);
            } else if (activePov === 'LEFT') {
                camera.position.set(player.position.x - 5.5, player.position.y + 2.2, player.position.z + 1.2);
                camera.lookAt(player.position.x, player.position.y + 1.2, player.position.z - 2.5);
            } else if (activePov === 'RIGHT') {
                camera.position.set(player.position.x + 5.5, player.position.y + 2.2, player.position.z + 1.2);
                camera.lookAt(player.position.x, player.position.y + 1.2, player.position.z - 2.5);
            } else if (activePov === 'FRONT') {
                camera.position.set(player.position.x * 0.35, player.position.y + 2.2, player.position.z - 6.5);
                camera.lookAt(player.position.x, player.position.y + 1.1, player.position.z);
            } else {
                camera.position.set(player.position.x * 0.35, player.position.y + 3.5, player.position.z + 6.5);
                camera.lookAt(player.position.x, player.position.y + 1.2, player.position.z - 4);
            }
        }

        function animate() {
            requestAnimationFrame(animate);

            if (!gameStarted) {
                renderer.render(scene, camera);
                return;
            }

            if (isGameOver || isPaused) return;

            if (isAccelerating) {
                currentSpeedKmh += 0.9;
            } else if (isBraking) {
                if (currentSpeedKmh > 0) currentSpeedKmh -= 1.8;
                if (currentSpeedKmh < 0) currentSpeedKmh = 0;
            } else {
                if (currentSpeedKmh > baseMinSpeedKmh) currentSpeedKmh -= 0.6;
            }

            updateSound();

            let moveSpeed = currentSpeedKmh * 0.007;
            player.position.z -= moveSpeed;

            if (frontWheelMesh && backWheelMesh) {
                frontWheelMesh.rotation.x += moveSpeed * 2.5;
                backWheelMesh.rotation.x += moveSpeed * 2.5;
            }

            if (brakeLightMesh && brakeLightPoint) {
                if (isBraking) {
                    brakeLightMesh.material.color.setHex(0xff0000);
                    brakeLightPoint.intensity = 2.0;
                } else {
                    brakeLightMesh.material.color.setHex(0x660000);
                    brakeLightPoint.intensity = 0;
                }
            }

            if (exhaustFlameGroup) {
                if (isAccelerating && currentSpeedKmh > 90) {
                    exhaustFlameGroup.visible = true;
                    const scale = 0.8 + Math.random() * 0.5;
                    exhaustFlameGroup.scale.set(scale, scale, scale * 1.2);
                    flameLight.intensity = 1.0 + Math.random() * 0.8;
                } else {
                    exhaustFlameGroup.visible = false;
                }
            }

            if (sparkParticles) {
                if (isBraking && currentSpeedKmh > 55) {
                    sparkParticles.visible = true;
                    const positions = sparkParticles.geometry.attributes.position.array;
                    for (let i = 0; i < positions.length; i += 3) {
                        positions[i] = (Math.random() - 0.5) * 0.4;
                        positions[i+1] = Math.random() * 0.3;
                        positions[i+2] = Math.random() * 0.5;
                    }
                    sparkParticles.geometry.attributes.position.needsUpdate = true;
                } else {
                    sparkParticles.visible = false;
                }
            }

            let targetRotZ = moveLeft ? 0.25 : (moveRight ? -0.25 : 0);
            currentRotZ += (targetRotZ - currentRotZ) * 0.1;
            player.rotation.z = currentRotZ;

            if (moveLeft && player.position.x > -roadWidth / 2 + 0.9) player.position.x -= 0.15;
            if (moveRight && player.position.x < roadWidth / 2 - 0.9) player.position.x += 0.15;

            // AKSI & ANIMASI NATURAL TANPA TEMBUS ROAD (Y-Offset Calculation)
            let targetRotX = 0;
            let targetRiderRotX = 0;
            let targetRiderPosZ = 0;
            let targetPosY = 0; // Mengangkat motor agar ban tidak tembus jalan

            if (currentStuntMode === 1) { // WHEELIE
                targetRotX = -0.45;
                targetPosY = 0.42; // Mengangkat pusat motor saat ban depan diangkat
                stuntScore += 2;
            } else if (currentStuntMode === 2) { // STOPPIE
                targetRotX = 0.35;
                targetPosY = 0.32; // Mengangkat belakang motor saat ban belakang diangkat
                stuntScore += 3;
            } else if (currentStuntMode === 3) { // SUPERMAN
                targetRiderRotX = 1.1; 
                targetRiderPosZ = 0.65;
                stuntScore += 4;
            }

            currentRotX += (targetRotX - currentRotX) * 0.1;
            player.rotation.x = currentRotX;
            player.position.y += (targetPosY - player.position.y) * 0.1;

            if (riderGroup) {
                riderGroup.rotation.x += (targetRiderRotX - riderGroup.rotation.x) * 0.1;
                riderGroup.position.z += (targetRiderPosZ - riderGroup.position.z) * 0.1;
            }

            updateCameraPosition();

            // LOOPING JALANAN DAN GROUND
            const totalLength = NUM_SEGMENTS * SEGMENT_SIZE;
            
            roadSegments.forEach(r => {
                if (r.position.z > player.position.z + SEGMENT_SIZE) {
                    r.position.z -= totalLength;
                }
            });
            
            groundSegments.forEach(g => {
                if (g.position.z > player.position.z + SEGMENT_SIZE) {
                    g.position.z -= totalLength;
                }
            });

            streetLights.forEach(lamp => {
                if (lamp.position.z > player.position.z + 20) {
                    lamp.position.z -= 900;
                }
            });

            trees.forEach(tree => {
                if (tree.position.z > player.position.z + 20) {
                    tree.position.z -= 900;
                }
            });

            clouds.forEach(cloud => {
                cloud.position.z += 0.05;
                if (cloud.position.z > player.position.z + 30) {
                    cloud.position.z -= 950;
                }
            });

            if (sunGroup) {
                sunGroup.position.z = player.position.z - 450;
            }

            if (Math.random() < 0.03) spawnObstacle();

            for (let i = obstacles.length - 1; i >= 0; i--) {
                let obs = obstacles[i];
                let diffX = Math.abs(player.position.x - obs.position.x);
                let diffZ = Math.abs(player.position.z - obs.position.z);

                if (diffX < 1.3 && diffZ < 1.0) {
                    endGame();
                }

                if (obs.position.z > player.position.z + 10) {
                    scene.remove(obs);
                    obstacles.splice(i, 1);
                }
            }

            distanceScore = Math.floor(-player.position.z);
            totalScore = distanceScore + stuntScore;
            document.getElementById('score').innerText = totalScore;
            document.getElementById('speed').innerText = Math.floor(currentSpeedKmh);

            renderer.render(scene, camera);
        }

        function endGame() {
            isGameOver = true;
            playCrashSound();
            document.getElementById('stunt-status').style.display = 'none';
            document.getElementById('final-score').innerText = totalScore;
            document.getElementById('final-stunt-score').innerText = stuntScore;
            document.getElementById('game-over').style.display = 'flex';
        }

        // PERBAIKAN RESET GAME TERMASUK RESET POHON & OBSTACLE
        function resetGame() {
            isGameOver = false;
            isPaused = false;
            distanceScore = 0;
            stuntScore = 0;
            totalScore = 0;
            currentSpeedKmh = baseMinSpeedKmh;
            currentStuntMode = 0;

            // Bersihkan semua tembok
            obstacles.forEach(obs => scene.remove(obs));
            obstacles = [];

            // Reset Motor
            player.position.set(0, 0, 0);
            player.rotation.set(0, 0, 0);
            currentRotX = 0;
            currentRotZ = 0;
            lastObstacleZ = 0;

            // Reset Jalanan
            for (let i = 0; i < NUM_SEGMENTS; i++) {
                const zPos = -i * SEGMENT_SIZE;
                roadSegments[i].position.z = zPos;
                groundSegments[i].position.z = zPos;
            }

            // PERBAIKAN: Reset posisi Pohon ke sekitar titik awal baru
            trees.forEach(tree => {
                const side = Math.random() < 0.5 ? -1 : 1;
                const xPos = side * (roadWidth / 2 + 2.5 + Math.random() * 22);
                const zPos = 100 - Math.random() * 900;
                tree.position.set(xPos, 0, zPos);
            });

            // Reset Lampu Jalan
            let lampIdx = 0;
            for (let z = 100; z > -900; z -= 35) {
                [-1, 1].forEach(side => {
                    if (streetLights[lampIdx]) {
                        streetLights[lampIdx].position.set(side * (roadWidth / 2 + 1.2), 0, z);
                        lampIdx++;
                    }
                });
            }

            updateCameraPosition();

            if (masterGain && audioCtx) {
                try {
                    masterGain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                } catch(e){}
            }

            document.getElementById('game-over').style.display = 'none';
            document.getElementById('pause-screen').style.display = 'none';
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        window.onload = init;
    </script>
</body>
</html>
